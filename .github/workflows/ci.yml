name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Compile
        run: python -m compileall fo4_persona_lab tests tools

      - name: Unit tests
        run: python -m unittest -v

      - name: Smoke check
        run: python tools/smoke_check.py

      - name: Bridge soak
        run: python tools/bridge_soak_test.py --workers 4 --requests-per-worker 6
